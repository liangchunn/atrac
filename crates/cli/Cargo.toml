[package]
name = "cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
mdct-disasm = ["at3/mdct-disasm"]

[[bin]]
name = "atrac"
path = "src/main.rs"

[dependencies]
at3 = { path = "../at3" }
at3p = { path = "../at3p" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"

[dev-dependencies]
serde_json = "1.0"
